version: "3.9"
services:
  postgres:
    image: postgres:15.1-alpine
    restart: always
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: teammates
      POSTGRES_PASSWORD: teammates
      POSTGRES_DB: teammates
  cron:
    container_name: teammates-cron-1
    build:
      context: cron-dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
